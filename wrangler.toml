name = "glacayo-com"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# Create the namespace with `npx wrangler kv namespace create LIKES`
# and paste its id here. Set a salt with `npx wrangler pages secret put LIKES_SALT`.
[[kv_namespaces]]
binding = "LIKES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
